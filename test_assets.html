<!doctype html>
<html><head><meta charset="utf-8"><title>資產測試</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe3ea}#c{display:block;width:100%;height:100%}#log{position:fixed;left:8px;top:8px;color:#222;font:12px monospace;white-space:pre}</style></head>
<body><canvas id="c"></canvas><div id="log"></div>
<script src="lib/three.bundle.js"></script><script src="lib/three.jsm.bundle.js"></script>
<script src="src/people3d.js"></script><script src="src/world3d.js"></script><script src="src/assets3d.js"></script><script src="src/character3d.js"></script>
<script>
const log=(t)=>{ document.getElementById('log').textContent+=t+'\n'; console.log(t); };
const canvas=document.getElementById('c'); const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setPixelRatio(1); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xdde9ea); const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,0.1,200);
scene.add(new THREE.HemisphereLight(0xe8f0ff,0xb8a88a,0.9)); const sun=new THREE.DirectionalLight(0xfff1d8,2.0); sun.position.set(8,14,10); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-15; sun.shadow.camera.right=15; sun.shadow.camera.top=15; sun.shadow.camera.bottom=-15; scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0xcdd6b0,roughness:1})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const q=new URLSearchParams(location.search); const mode=q.get('m')||'env';
(async()=>{ await ASSETS.preload(Object.keys(ASSETS.manifest),(p,k)=>{}); log('errors: '+JSON.stringify(ASSETS.errors)); log(ASSETS.report().filter(r=>r.loaded).map(r=>r.key).join(','));
  if(mode==='env'){ const items=[['tree.palm',{height:9}],['tree.leafy',{height:7}],['tree.conifer',{height:7}],['prop.bench',{}],['prop.cup',{}],['prop.bowl',{}],['prop.bag',{}]]; let x=-12; for(const [k,o] of items){ const inst=ASSETS.get(k,o); inst.position.set(x,0,0); scene.add(inst); const box=new THREE.Box3().setFromObject(inst); const s=box.getSize(new THREE.Vector3()); log(k+' size '+s.toArray().map(v=>v.toFixed(2)).join(',')+' minY '+box.min.y.toFixed(2)); x+=4; } const grid=new THREE.GridHelper(40,40); scene.add(grid); camera.position.set(0,6,22); camera.lookAt(0,3,0); }
  if(mode==='bench'){ const b=ASSETS.get('prop.bench',{}); scene.add(b); const axes=new THREE.AxesHelper(2); scene.add(axes); const h=CHAR.build(Object.assign({},P3.CAST.zhe)); h.position.set(0,0,0); scene.add(h); h.userData.anim.pose='sit'; CHAR.animate(h,0.1,{pose:'sit'}); camera.position.set(3,2,3.5); camera.lookAt(0,0.8,0); }
  if(mode==='char'){ const spec=Object.assign({},P3.CAST.hero_m,{model:'char.rpm_sample'}); const h=CHAR.build(spec); log('driver '+h.userData.driver); scene.add(h); const h2=CHAR.build(P3.CAST.hero_f); h2.position.set(1.2,0,0); scene.add(h2); window.__h=h; const box=new THREE.Box3().setFromObject(h); log('rpm size '+box.getSize(new THREE.Vector3()).toArray().map(v=>v.toFixed(2)).join(',')); camera.position.set(0.6,1.5,4.2); camera.lookAt(0.6,0.95,0); let t=0; const clock=new THREE.Timer(); function frame(){ clock.update(); const dt=clock.getDelta(); t+=dt; const pose=q.get('pose')||(t<2?'idle':(t<4?'walk':(t<6?'run':(t<8?'sit':(t<10?'read':(t<12?'talk':'wave')))))); CHAR.animate(h,dt,{pose,speed:pose==='walk'?1.45:(pose==='run'?4.1:0),lookAt:q.get('look')?new THREE.Vector3(3,1.5,3):null}); CHAR.animate(h2,dt,{pose:'idle'}); renderer.render(scene,camera); requestAnimationFrame(frame); } frame(); window.__ready=true; return; }
  renderer.render(scene,camera); window.__ready=true; function frame(){ renderer.render(scene,camera); requestAnimationFrame(frame); } frame();
})().catch(e=>log('ERR '+e.message+' '+e.stack));
</script></body></html>
