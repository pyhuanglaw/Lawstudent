<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>3D 最小測試</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe3ea;touch-action:none}#c{display:block;width:100%;height:100%}#hud{position:fixed;left:12px;top:12px;color:#fff;font:14px sans-serif;text-shadow:0 1px 2px #000;pointer-events:none}#joy{position:fixed;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);touch-action:none}#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.7)}</style></head>
<body><canvas id="c"></canvas><div id="hud">點擊地面移動 / WASD / 搖桿</div><div id="joy"><div id="knob"></div></div>
<script src="lib/three.bundle.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xcfe3ea);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,200);
scene.add(new THREE.HemisphereLight(0xfff3d6,0x8fb08a,0.9)); const sun=new THREE.DirectionalLight(0xfff0d0,1.2); sun.position.set(8,14,6); scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshLambertMaterial({color:0x9cc47c})); ground.rotation.x=-Math.PI/2; scene.add(ground);
const path=new THREE.Mesh(new THREE.PlaneGeometry(6,40),new THREE.MeshLambertMaterial({color:0xe7dcc4})); path.rotation.x=-Math.PI/2; path.position.y=0.01; scene.add(path);
for(let i=0;i<8;i++){ const t=new THREE.Group(); const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.25,3,8),new THREE.MeshLambertMaterial({color:0x8b6a4e})); trunk.position.y=1.5; t.add(trunk); const crown=new THREE.Mesh(new THREE.SphereGeometry(1.2,10,8),new THREE.MeshLambertMaterial({color:0x5f9a5e})); crown.position.y=3.4; t.add(crown); t.position.set((i%2?4.5:-4.5),0,-16+i*4.5); scene.add(t); }
const hero=new THREE.Group(); const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.35,0.9,4,12),new THREE.MeshLambertMaterial({color:0x8c3b47})); body.position.y=0.95; hero.add(body); const head=new THREE.Mesh(new THREE.SphereGeometry(0.34,14,12),new THREE.MeshLambertMaterial({color:0xf7dcc6})); head.position.y=1.85; hero.add(head); scene.add(hero);
const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.4,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.2})); shadow.rotation.x=-Math.PI/2; shadow.position.y=0.02; hero.add(shadow);
let target=null, vel=new THREE.Vector3(); const keys={}; addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true); addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const ray=new THREE.Raycaster(); const ptr=new THREE.Vector2(); let down=null;
canvas.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,t:performance.now()}; });
canvas.addEventListener('pointerup',e=>{ if(!down) return; const dx=e.clientX-down.x, dy=e.clientY-down.y; if(Math.hypot(dx,dy)<8&&performance.now()-down.t<400){ ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ptr,camera); const hit=ray.intersectObject(ground)[0]; if(hit){ target=hit.point.clone(); } } down=null; });
const joy=document.getElementById('joy'), knob=document.getElementById('knob'); let joyVec={x:0,y:0}, joyId=null;
joy.addEventListener('pointerdown',e=>{ joyId=e.pointerId; joy.setPointerCapture(e.pointerId); moveKnob(e); }); joy.addEventListener('pointermove',e=>{ if(e.pointerId===joyId) moveKnob(e); }); joy.addEventListener('pointerup',e=>{ joyId=null; joyVec={x:0,y:0}; knob.style.left='35px'; knob.style.top='35px'; });
function moveKnob(e){ const r=joy.getBoundingClientRect(); let dx=e.clientX-(r.left+60), dy=e.clientY-(r.top+60); const d=Math.hypot(dx,dy); if(d>45){ dx*=45/d; dy*=45/d; } knob.style.left=(35+dx)+'px'; knob.style.top=(35+dy)+'px'; joyVec={x:dx/45,y:dy/45}; }
const clock=new THREE.Clock(); let camAngle=Math.PI*0.15;
function frame(){ const dt=Math.min(clock.getDelta(),0.05); const sp=3.2; let mv=new THREE.Vector3();
  if(keys['w']||keys['arrowup']) mv.z-=1; if(keys['s']||keys['arrowdown']) mv.z+=1; if(keys['a']||keys['arrowleft']) mv.x-=1; if(keys['d']||keys['arrowright']) mv.x+=1; mv.x+=joyVec.x; mv.z+=joyVec.y;
  if(mv.lengthSq()>0.01){ mv.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),camAngle); target=null; hero.position.addScaledVector(mv,sp*dt); hero.rotation.y=Math.atan2(mv.x,mv.z); }
  else if(target){ const d=target.clone().sub(hero.position); d.y=0; if(d.length()<0.1) target=null; else { d.normalize(); hero.position.addScaledVector(d,sp*dt); hero.rotation.y=Math.atan2(d.x,d.z); } }
  const camOff=new THREE.Vector3(0,9,9).applyAxisAngle(new THREE.Vector3(0,1,0),camAngle); camera.position.lerp(hero.position.clone().add(camOff),0.12); camera.lookAt(hero.position.x,hero.position.y+1,hero.position.z);
  renderer.render(scene,camera); requestAnimationFrame(frame); }
frame(); addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); });
window.__hero=hero; window.__setTarget=(x,z)=>{ target=new THREE.Vector3(x,0,z); };
</script></body></html>
