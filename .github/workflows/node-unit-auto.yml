# 每次 push 改到遊戲的 commit（src／tests／lib／assets／index.html）就自動跑全部 Node 單元測試（BB-C TEST-METHODS-1104 的 T5；使用者 11-04 14:2x 對 BB-C「自己參考github開源自己決定」，LAWWW-C 14:2x 同意加）。
# 公開專案的 GitHub 標準執行環境免費、不用 GPU；同一條分支有新的 push 就取消舊的那一輪（只看最新的）。
# 只改文件的 push 不跑（D135：只有改到遊戲的 commit 要逐筆核對）。手動指定版本的全套照舊用 claude/gha-node-sweep 的 node-sweep。
# 結果：執行摘要、artifact、執行紀錄最後的失敗清單（Claude 的雲端機器讀得到紀錄，讀不到 artifact）。
name: node-unit-auto
on:
  push:
    branches: ['claude/**']
    paths: ['src/**', 'tests/**', 'lib/**', 'assets/**', 'index.html']
permissions:
  contents: read
concurrency:
  group: node-unit-auto-${{ github.ref }}
  cancel-in-progress: false   # 2026-11-12 LAWWW-C：原本 true，幾分鐘推一次就永遠跑不完（下午連 7 輪 cancelled，兩支紅的沒人發現）。false＝正在跑的那一輪跑完；排隊的只留最新一筆
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 版本
        run: git log -1 --format='%H %s' | cut -c1-200
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 全部 Node 單元測試（同一台機器 4 支同時跑）
        run: |
          mkdir -p out
          ls tests/*_unit.js > out/list.txt
          echo "共 $(wc -l < out/list.txt) 支"
          start=$(date +%s)
          xargs -P 4 -I{} bash -c 'n=$(basename "{}" .js); s=$(date +%s); timeout 600 node "{}" > "out/$n.log" 2>&1; c=$?; e=$(( $(date +%s) - s )); l=$(tail -1 "out/$n.log" | tr "\t" " " | cut -c1-150); printf "%s\t%s\t%s\t%s\n" "{}" "$c" "$e" "$l" >> out/summary.tsv' < out/list.txt
          echo "總共 $(( $(date +%s) - start )) 秒"
      - name: 整理結果
        if: always()
        run: |
          cd out
          awk -F'\t' '$2!=0 || $4 ~ /FAIL/ {print}' summary.tsv > fail.tsv
          # 最後一行看不出結果、而且整份 log 也沒有「ALL PASS／全部通過」那一行的才算（BB-C 11-04：bookstore_exit 印完 ALL PASS 以後才跑出非同步的載入警告）
          : > unknown.tsv; while IFS=$'\t' read -r f c e l; do n=$(basename "$f" .js); if [ "$c" = 0 ] && ! printf '%s' "$l" | grep -q -E 'FAIL|ALL PASS|全部通過|PASS' && ! grep -q -E '^(ALL PASS|全部通過)' "$n.log"; then printf '%s\t%s\t%s\t%s\n' "$f" "$c" "$e" "$l" >> unknown.tsv; fi; done < summary.tsv
          grep -l -E '^(（找不到|跳過逐點|SKIPPED|not found|No such file)' *.log > skipped.txt || true
          sort -t$'\t' -k3 -nr summary.tsv | head -15 > slowest.tsv
          {
            echo "## 全部 Node 單元測試"
            echo "- 版本：$(git -C .. rev-parse --short HEAD)"
            echo "- 共 $(wc -l < summary.tsv) 支；失敗 $(wc -l < fail.tsv)；最後一行看不出結果 $(wc -l < unknown.tsv)；疑似缺資料（找不到／SKIPPED／not found） $(wc -l < skipped.txt)"
            echo "### 最慢 15 支（秒）"; echo '```'; cut -f1,3 slowest.tsv; echo '```'
            echo "### 疑似缺資料被略過（要確認）"; echo '```'; cat skipped.txt; echo '```'
            echo "### 最後一行看不出結果（要人看）"; echo '```'; cat unknown.tsv; echo '```'
            echo "### 失敗"; echo '```'; cat fail.tsv; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "===== 疑似缺資料的那一行 ====="
          while read f; do echo "----- $f"; grep -m3 -E '^(（找不到|跳過逐點|SKIPPED|not found|No such file)' "$f" | cut -c1-300; done < skipped.txt
          echo "===== 失敗的測試（FAIL 行＋最後 5 行）====="
          cut -f1 fail.tsv | while read f; do n=$(basename "$f" .js); echo "----- $f"; grep -E '^FAIL|Error|錯誤' "$n.log" | head -12 | cut -c1-400; tail -5 "$n.log" | cut -c1-400; done
          echo "===== 失敗清單 ====="; cut -f1,2,4 fail.tsv
          test ! -s fail.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-unit-auto-out
          path: out/
          retention-days: 14
