<!doctype html><html><head><meta charset="utf-8"><title>VRM pipeline test</title><style>body{margin:0;background:#223;color:#fff;font:13px monospace}#log{position:fixed;left:6px;top:6px;white-space:pre;pointer-events:none}</style></head><body>
<div id="log"></div>
<script src="lib/three.bundle.js"></script>
<script src="lib/three.jsm.bundle.js"></script>
<script src="lib/three-vrm.bundle.js"></script>
<script>
/* VRM pipeline 驗證：GLTFLoader + VRMLoaderPlugin 載入 → normalized humanoid → Mixamo clip（來自 mixamo_clips.glb）重定向 → 播放。
   結果掛在 window.__vrmResult 供 Playwright 讀取。 */
const MAP={Hips:'hips',Spine:'spine',Spine1:'chest',Spine2:'upperChest',Neck:'neck',Head:'head',LeftShoulder:'leftShoulder',LeftArm:'leftUpperArm',LeftForeArm:'leftLowerArm',LeftHand:'leftHand',LeftHandThumb1:'leftThumbMetacarpal',LeftHandThumb2:'leftThumbProximal',LeftHandThumb3:'leftThumbDistal',LeftHandIndex1:'leftIndexProximal',LeftHandIndex2:'leftIndexIntermediate',LeftHandIndex3:'leftIndexDistal',LeftHandMiddle1:'leftMiddleProximal',LeftHandMiddle2:'leftMiddleIntermediate',LeftHandMiddle3:'leftMiddleDistal',LeftHandRing1:'leftRingProximal',LeftHandRing2:'leftRingIntermediate',LeftHandRing3:'leftRingDistal',LeftHandPinky1:'leftLittleProximal',LeftHandPinky2:'leftLittleIntermediate',LeftHandPinky3:'leftLittleDistal',RightShoulder:'rightShoulder',RightArm:'rightUpperArm',RightForeArm:'rightLowerArm',RightHand:'rightHand',RightHandThumb1:'rightThumbMetacarpal',RightHandThumb2:'rightThumbProximal',RightHandThumb3:'rightThumbDistal',RightHandIndex1:'rightIndexProximal',RightHandIndex2:'rightIndexIntermediate',RightHandIndex3:'rightIndexDistal',RightHandMiddle1:'rightMiddleProximal',RightHandMiddle2:'rightMiddleIntermediate',RightHandMiddle3:'rightMiddleDistal',RightHandRing1:'rightRingProximal',RightHandRing2:'rightRingIntermediate',RightHandRing3:'rightRingDistal',RightHandPinky1:'rightLittleProximal',RightHandPinky2:'rightLittleIntermediate',RightHandPinky3:'rightLittleDistal',LeftUpLeg:'leftUpperLeg',LeftLeg:'leftLowerLeg',LeftFoot:'leftFoot',LeftToeBase:'leftToes',RightUpLeg:'rightUpperLeg',RightLeg:'rightLowerLeg',RightFoot:'rightFoot',RightToeBase:'rightToes'};
const log=(s)=>{ document.getElementById('log').textContent+=s+'\n'; console.log(s); };
// Mixamo（來源 T-pose 骨架）→ VRM normalized humanoid（也是 T-pose、identity 旋轉）：官方 loadMixamoAnimation 的做法
function mixamoToVRM(clip,srcScene,vrm){ const tracks=[]; const restInv=new THREE.Quaternion(), parentRest=new THREE.Quaternion(), q=new THREE.Quaternion(); const srcHips=srcScene.getObjectByName('mixamorigHips'); const hipsScale=srcHips?(vrm.humanoid.normalizedRestPose.hips.position[1]/(srcHips.position.y||1)):1;
  for(const t of clip.tracks){ const [name,prop]=t.name.split('.'); const bone=MAP[name.replace(/^mixamorig:?/,'')]; const node=bone&&vrm.humanoid.getNormalizedBoneNode(bone); const src=srcScene.getObjectByName(name); if(!node||!src) continue; src.getWorldQuaternion(restInv).invert(); src.parent.getWorldQuaternion(parentRest);
    if(t instanceof THREE.QuaternionKeyframeTrack){ const vals=new Float32Array(t.values.length); for(let i=0;i<t.values.length;i+=4){ q.fromArray(t.values,i); q.premultiply(parentRest).multiply(restInv); vals[i]=q.x; vals[i+1]=q.y; vals[i+2]=q.z; vals[i+3]=q.w; } if(vrm.meta&&vrm.meta.metaVersion==='0'){ for(let i=0;i<vals.length;i+=4){ vals[i]=-vals[i]; vals[i+2]=-vals[i+2]; } } tracks.push(new THREE.QuaternionKeyframeTrack(node.name+'.'+prop,Array.from(t.times),Array.from(vals))); }
    else if(t instanceof THREE.VectorKeyframeTrack&&bone==='hips'){ const vals=Array.from(t.values).map((v,i)=>(vrm.meta&&vrm.meta.metaVersion==='0'&&i%3!==1?-v:v)*hipsScale); tracks.push(new THREE.VectorKeyframeTrack(node.name+'.'+prop,Array.from(t.times),vals)); } }
  return new THREE.AnimationClip(clip.name,clip.duration,tracks); }
(async()=>{ try{
  const W=innerWidth,H=innerHeight; const renderer=new THREE.WebGLRenderer({antialias:false}); renderer.setPixelRatio(1); renderer.setSize(W,H); renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
  const scene=new THREE.Scene(); scene.background=new THREE.Color(0x334455); const cam=new THREE.PerspectiveCamera(35,W/H,0.1,50); cam.position.set(0,1.2,3.6); cam.lookAt(0,0.9,0);
  scene.add(new THREE.HemisphereLight(0xffffff,0x665544,1.6)); const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(2,4,3); scene.add(sun); scene.add(new THREE.GridHelper(4,8,0x888888,0x555555));
  const loader=new THREE_JSM.GLTFLoader.GLTFLoader(); loader.register(p=>new THREE_VRM.VRMLoaderPlugin(p));
  const t0=performance.now(); const Q=new URLSearchParams(location.search); const file='assets/models/char/'+(Q.get('m')||'vrm_sample')+'.vrm'; const HIDE=(Q.get('hide')||'').split(',').filter(Boolean); const gltf=await loader.loadAsync(file); const vrm=gltf.userData.vrm; if(!vrm) throw new Error('no vrm in userData'); THREE_VRM.VRMUtils.removeUnnecessaryVertices(gltf.scene); THREE_VRM.VRMUtils.combineSkeletons(gltf.scene); THREE_VRM.VRMUtils.rotateVRM0(vrm); scene.add(vrm.scene); vrm.scene.traverse(o=>{ if((o.isMesh||o.isSkinnedMesh)&&HIDE.length){ const mn=(o.material&&o.material.name)||''; if(HIDE.some(h=>o.name.includes(h)||mn.includes(h))) o.visible=false; } }); const ms=Math.round(performance.now()-t0);
  const meta=vrm.meta||{}; log('VRM loaded '+ms+'ms metaVersion='+meta.metaVersion+' name='+(meta.name||meta.title)+' license='+(meta.licenseUrl||meta.licenseName||'?')+' authors='+(meta.authors||meta.author));
  const box=new THREE.Box3().setFromObject(vrm.scene); log('height '+(box.max.y-box.min.y).toFixed(2)+' m; humanoid bones '+Object.keys(vrm.humanoid.humanBones).length);
  // 表情
  if(vrm.expressionManager){ log('expressions: '+vrm.expressionManager.expressions.map(e=>e.expressionName).join(',')); }
  // Mixamo clips
  const src=await new THREE_JSM.GLTFLoader.GLTFLoader().loadAsync('assets/models/char/mixamo_clips.glb'); src.scene.updateMatrixWorld(true); const clips={}; for(const a of src.animations){ clips[a.name]=mixamoToVRM(a,src.scene,vrm); } log('clips: '+Object.keys(clips).map(k=>k+'('+clips[k].tracks.length+')').join(' '));
  const mixer=new THREE.AnimationMixer(vrm.scene); const actions={}; for(const k in clips) actions[k]=mixer.clipAction(clips[k]); let cur='idle'; actions.idle.play();
  window.__pose=function(tab,dropY){ for(const k in actions) actions[k].stop(); cur=null; vrm.humanoid.resetNormalizedPose(); for(const n in tab){ const node=vrm.humanoid.getNormalizedBoneNode(n); if(node) node.rotation.set(tab[n][0],tab[n][1],tab[n][2]); } vrm.scene.position.y=-(dropY||0); };
  window.__vrm={vrm,mixer,actions,set(n){ if(cur===n) return; actions[cur].fadeOut(0.2); actions[n].reset().fadeIn(0.2).play(); cur=n; },expr(n,v){ if(vrm.expressionManager){ vrm.expressionManager.setValue(n,v); } }};
  let last=performance.now(); function frame(){ requestAnimationFrame(frame); const now=performance.now(); const dt=Math.min(0.1,(now-last)/1000); last=now; mixer.update(dt); vrm.update(dt); renderer.render(scene,cam); } frame();
  window.__vrmResult={ok:true,ms,metaVersion:meta.metaVersion,height:+(box.max.y-box.min.y).toFixed(2),bones:Object.keys(vrm.humanoid.humanBones).length,clips:Object.keys(clips),tris:renderer.info.render.triangles};
}catch(e){ log('ERROR '+e.message); console.error(e); window.__vrmResult={ok:false,err:String(e)}; } })();
</script></body></html>
