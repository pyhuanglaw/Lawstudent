<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#EFE6D6;font-family:sans-serif}canvas{display:block}</style></head><body>
<canvas id="c" width="1200" height="760"></canvas>
<script src="a_art.js"></script>
<script>
const cv=document.getElementById('c'); const ctx=cv.getContext('2d');
const player=makeSpec({skin:SKIN_COLORS[1],hair:HAIR_COLORS[1],hairStyle:'bob',top:{style:'hoodie',color:'#8C3B47',inner:'#fff'},bottom:{style:'pants',color:'#3B3F4A'},shoes:'#F4F1EA',acc:{bag:'backpack',bagColor:'#3B3F4A'}});
ctx.fillStyle='#EFE6D6'; ctx.fillRect(0,0,1200,760);
const dirs=['down','left','right','up']; const poses=['stand','walk','walk','sit','read'];
let y=110;
const specs=[['player',player],['an',NPC_SPECS.an],['zhe',NPC_SPECS.zhe],['sis',NPC_SPECS.sis],['may',NPC_SPECS.may],['lee',NPC_SPECS.lee]];
specs.forEach(([name,sp],row)=>{ let x=60; ctx.fillStyle='#333'; ctx.font='14px sans-serif'; ctx.fillText(name,10,y-40);
  dirs.forEach(d=>{ poses.forEach((p,i)=>{ drawChar(ctx,x,y,sp,{dir:d,pose:p,phase:i===1?0.25:i===2?0.75:0,t:1.3,scale:1.15,blink:false}); x+=48; }); x+=14; });
  y+=118; });
// portraits
let x=40; ['normal','smile','laugh','surprise','worried','shy'].forEach((e,i)=>{ const pc=document.createElement('canvas'); pc.width=120; pc.height=140; const pctx=pc.getContext('2d'); drawPortrait(pctx,i%2?NPC_SPECS.an:player,e,120,140); ctx.drawImage(pc,x,y-100); x+=130; });
drawCat(ctx,900,y-20,{t:1,pose:'sit'}); drawCat(ctx,980,y-20,{t:1,pose:'walk'});
</script></body></html>
