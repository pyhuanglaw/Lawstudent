<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>角色測試</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe3ea}#c{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script src="lib/three.bundle.js"></script><script src="src/chars3d.js"></script>
<script>
const canvas=document.getElementById('c'); const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setPixelRatio(1); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xdfe9ec);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.1,100);
scene.add(new THREE.HemisphereLight(0xfff5e0,0xa9bfa5,1.25)); const sun=new THREE.DirectionalLight(0xfff0d6,1.6); sun.position.set(4,8,6); scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshToonMaterial({color:0xcfd8b8,gradientMap:C3.toonGradient(3)})); ground.rotation.x=-Math.PI/2; scene.add(ground);
const player={skin:'#f7dcc6',hair:'#3b2a1e',hairStyle:'bob',iris:'#4a3020',lash:true,top:{style:'hoodie',color:'#8c3b47',inner:'#fff'},bottom:{style:'pants',color:'#3b3f4a'},shoes:'#f4f1ea',acc:{bag:'backpack',bagColor:'#3b3f4a'}};
const an={skin:'#f7dcc6',hair:'#2b1e17',hairStyle:'long',iris:'#3a2a20',lash:true,top:{style:'cardigan',color:'#2f5d50',inner:'#ffffff'},bottom:{style:'skirt',color:'#2e3a55'},shoes:'#f7f7f4',acc:{glasses:true,bag:'tote',bagColor:'#d9d3c6'}};
const zhe={skin:'#efcbae',hair:'#5a3b25',hairStyle:'short',iris:'#4a3020',top:{style:'hoodie',color:'#e0b95b',inner:'#fff'},bottom:{style:'pants',color:'#4a5a78'},shoes:'#3a6fb0',acc:{bag:'backpack',bagColor:'#3b3f4a'}};
const sis={skin:'#fbe5d3',hair:'#3b2a1e',hairStyle:'pony',iris:'#5a3a2a',lash:true,top:{style:'shirt',color:'#ffffff',inner:'#fff'},bottom:{style:'pants',color:'#c9b28c'},shoes:'#8b5e3c',acc:{}};
const mode=new URLSearchParams(location.search).get('m')||'lineup';
const chars=[];
function put(spec,x,z,rotY,state){ const c=C3.build(spec); c.position.set(x,0,z); c.rotation.y=rotY; scene.add(c); chars.push({c,state}); return c; }
if(mode==='lineup'){ // 正/側/背 + 走路
  put(player,-2.4,0,0,{pose:'idle'}); put(player,-1.2,0,Math.PI/2,{pose:'idle'}); put(player,0,0,Math.PI,{pose:'idle'}); put(player,1.2,0,0,{pose:'walk',speed:1.6}); put(player,2.4,0,Math.PI/2,{pose:'walk',speed:1.6});
  camera.position.set(0,2.2,6.2); camera.lookAt(0,0.8,0);
} else if(mode==='poses'){ put(player,-2.4,0,0,{pose:'run',speed:4}); put(player,-1.2,0,0,{pose:'sit'}); put(player,0,0,0,{pose:'read'}); put(player,1.2,0,0.4,{pose:'talk'}); const c=put(an,2.4,0,-0.3,{pose:'idle'}); C3.setExpr(c,'smile'); camera.position.set(0,2.2,6.2); camera.lookAt(0,0.8,0);
} else if(mode==='closeup'){ const c=put(player,-0.7,0,0.2,{pose:'idle'}); C3.setExpr(c,'smile'); const d=put(an,0.7,0,-0.2,{pose:'idle'}); camera.position.set(0,1.5,2.6); camera.lookAt(0,1.1,0);
} else if(mode==='npcs'){ put(an,-1.8,0,0,{pose:'idle'}); put(zhe,-0.6,0,0,{pose:'walk',speed:1.6}); put(sis,0.6,0,Math.PI/2,{pose:'idle'}); put(an,1.8,0,Math.PI,{pose:'idle'}); camera.position.set(0,2.2,6.2); camera.lookAt(0,0.8,0); }
let t=0; function frame(){ t+=1/60; for(const o of chars) C3.animate(o.c,1/60,o.state); renderer.render(scene,camera); requestAnimationFrame(frame); } frame();
</script></body></html>
