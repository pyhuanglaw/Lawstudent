<!doctype html>
<html><head><meta charset="utf-8"><title>RPM 重定向測試</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe3ea}#c{display:block;width:100%;height:100%}#log{position:fixed;left:8px;top:8px;color:#222;font:12px monospace;white-space:pre}</style></head>
<body><canvas id="c"></canvas><div id="log"></div>
<script src="lib/three.bundle.js"></script><script src="lib/three.jsm.bundle.js"></script>
<script>
const log=(t)=>{ document.getElementById('log').textContent+=t+'\n'; console.log(t); };
const canvas=document.getElementById('c'); const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setPixelRatio(1); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xdde9ea); const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,100);
scene.add(new THREE.HemisphereLight(0xe8f0ff,0xb8a88a,0.9)); const sun=new THREE.DirectionalLight(0xfff1d8,2.0); sun.position.set(5,9,7); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-6; sun.shadow.camera.right=6; sun.shadow.camera.top=6; sun.shadow.camera.bottom=-6; scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0xd9d0bd,roughness:1})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const loader=new THREE_JSM.GLTFLoader.GLTFLoader(); const q=new URLSearchParams(location.search); const mode=q.get('m')||'lineup'; const animName=q.get('a')||'walk';
function load(url){ return new Promise((res,rej)=>loader.load(url,res,undefined,rej)); }
// ---- 重定向：以「靜止姿勢世界旋轉」補償兩個骨架的 bind pose 差異 ----
function restWorldQuats(root){ root.updateMatrixWorld(true); const m=new Map(); root.traverse(o=>{ if(o.isBone||o.type==='Bone'||o.parent&&o.parent.isBone||true){ const wq=new THREE.Quaternion(); o.getWorldQuaternion(wq); m.set(o.name,{wq,node:o}); } }); return m; }
function retarget(clip,srcRoot,dstRoot,opts){ opts=opts||{}; const S=restWorldQuats(srcRoot), D=restWorldQuats(dstRoot); const tracks=[]; const tmpQ=new THREE.Quaternion(), q=new THREE.Quaternion();
  for(const t of clip.tracks){ const m=t.name.match(/^(.+)\.(quaternion|position)$/); if(!m) continue; const srcName=m[1]; const dstName=srcName.replace(/^mixamorig:?/,''); const s=S.get(srcName), d=D.get(dstName); if(!s||!d) continue;
    if(m[2]==='position'){ if(dstName!=='Hips'||opts.noHipsPos) continue; // 髖部位移：只取相對 rest 的差，並換算比例
      const sp=s.node.position.clone(); const dp=d.node.position.clone(); const sc=opts.posScale||1; const vals=new Float32Array(t.values.length); for(let i=0;i<t.times.length;i++){ vals[i*3]=dp.x+(t.values[i*3]-sp.x)*sc; vals[i*3+1]=dp.y+(t.values[i*3+1]-sp.y)*sc; vals[i*3+2]=dp.z+(t.values[i*3+2]-sp.z)*sc; } tracks.push(new THREE.VectorKeyframeTrack(dstName+'.position',Array.from(t.times),Array.from(vals))); continue; }
    const sParent=s.node.parent, dParent=d.node.parent; const spW=new THREE.Quaternion(); if(sParent) sParent.getWorldQuaternion(spW); const dpW=new THREE.Quaternion(); if(dParent) dParent.getWorldQuaternion(dpW); const sInv=s.wq.clone().invert(); const dpInv=dpW.clone().invert();
    const vals=new Float32Array(t.values.length); for(let i=0;i<t.times.length;i++){ q.set(t.values[i*4],t.values[i*4+1],t.values[i*4+2],t.values[i*4+3]); // world delta = spW * q * sInv ; dst local = dpInv * delta * d.wq
      tmpQ.copy(spW).multiply(q).multiply(sInv); tmpQ.premultiply(dpInv).multiply(d.wq); vals[i*4]=tmpQ.x; vals[i*4+1]=tmpQ.y; vals[i*4+2]=tmpQ.z; vals[i*4+3]=tmpQ.w; }
    tracks.push(new THREE.QuaternionKeyframeTrack(dstName+'.quaternion',Array.from(t.times),Array.from(vals))); }
  return new THREE.AnimationClip(clip.name,clip.duration,tracks); }
const mixers=[];
(async()=>{
  const xbot=await load('assets/models/Xbot.glb'); const rpm=await load('assets/models/readyplayer.me.glb'); window.__rpm=rpm; window.__xbot=xbot;
  // Xbot 的 armature scale 0.01：位置軌跡是公分
  let hipsSrc=null; xbot.scene.traverse(o=>{ if(o.name==='mixamorigHips') hipsSrc=o; }); const armScale=hipsSrc?hipsSrc.parent.getWorldScale(new THREE.Vector3()).y:1; log('xbot armature scale '+armScale.toFixed(3));
  const clips={}; for(const a of xbot.animations){ clips[a.name]=retarget(a,xbot.scene,rpm.scene,{posScale:armScale}); }
  log('clips: '+Object.keys(clips).join(',')+' tracks '+clips.walk.tracks.length);
  function place(x,rotY,anim,hide){ const obj=THREE_JSM.SkeletonUtils.clone(rpm.scene); obj.traverse(o=>{ if(o.isMesh||o.isSkinnedMesh){ o.castShadow=true; o.frustumCulled=false; if(hide&&hide.some(h=>o.name.includes(h))) o.visible=false; } }); obj.position.set(x,0,0); obj.rotation.y=rotY; scene.add(obj); const mixer=new THREE.AnimationMixer(obj); const act=mixer.clipAction(clips[anim]); act.play(); mixers.push(mixer); return obj; }
  const hide=['Beard','Headwear'];
  if(mode==='lineup'){ place(-2.4,0,'idle',hide); place(-0.8,Math.PI/2,'walk',hide); place(0.8,Math.PI,'walk',hide); place(2.4,0.3,'run',hide); camera.position.set(0,1.7,6.2); camera.lookAt(0,0.95,0); }
  if(mode==='one'){ place(0,q.get('r')?parseFloat(q.get('r')):0.4,animName,hide); camera.position.set(0,1.6,3.6); camera.lookAt(0,0.95,0); }
  if(mode==='face'){ place(0,0.15,'idle',hide); camera.position.set(0,1.62,1.3); camera.lookAt(0,1.58,0); }
  const clock=new THREE.Timer(); let t=0; function frame(){ clock.update(); const dt=clock.getDelta(); t+=dt; for(const m of mixers) m.update(dt); renderer.render(scene,camera); requestAnimationFrame(frame); } frame(); window.__ready=true;
})().catch(e=>log('ERR '+e.message+' '+e.stack));
</script></body></html>
