<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>人物測試</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe3ea}#c{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script src="lib/three.bundle.js"></script><script src="src/people3d.js"></script>
<script>
const canvas=document.getElementById('c'); const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setPixelRatio(1); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xdde9ea); scene.fog=new THREE.Fog(0xdde9ea,20,60);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,100);
scene.add(new THREE.HemisphereLight(0xe8f0ff,0xb8a88a,0.75)); const sun=new THREE.DirectionalLight(0xfff1d8,2.2); sun.position.set(5,9,7); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-8; sun.shadow.camera.right=8; sun.shadow.camera.top=8; sun.shadow.camera.bottom=-8; sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.02; scene.add(sun); const rim=new THREE.DirectionalLight(0xcfe3ff,0.6); rim.position.set(-6,6,-8); scene.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0xd9d0bd,roughness:1})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const mode=new URLSearchParams(location.search).get('m')||'lineup';
const chars=[];
function put(spec,x,z,rotY,state){ const c=P3.build(spec); c.position.set(x,0,z); c.rotation.y=rotY; scene.add(c); chars.push({c,state}); return c; }
const M=P3.CAST.hero_m, F=P3.CAST.hero_f;
if(mode==='lineup'){ put(M,-3,0,0,{pose:'idle'}); put(M,-1.5,0,Math.PI/2,{pose:'idle',handsPockets:true}); put(M,0,0,Math.PI,{pose:'idle'}); put(M,1.5,0,0.2,{pose:'walk',speed:1.4}); put(M,3,0,Math.PI/2,{pose:'walk',speed:1.4}); camera.position.set(0,1.9,7.4); camera.lookAt(0,0.95,0); }
if(mode==='lineupf'){ put(F,-3,0,0,{pose:'idle'}); put(F,-1.5,0,Math.PI/2,{pose:'idle'}); put(F,0,0,Math.PI,{pose:'idle'}); put(F,1.5,0,0.2,{pose:'walk',speed:1.4}); put(F,3,0,Math.PI/2,{pose:'walk',speed:1.4}); camera.position.set(0,1.9,7.4); camera.lookAt(0,0.95,0); }
if(mode==='pair'){ const a=put(M,-0.55,0,0.35,{pose:'idle',handsPockets:true}); const b=put(F,0.55,0,-0.4,{pose:'talk'}); P3.setExpr(b,'smile'); camera.position.set(0.3,1.55,3.2); camera.lookAt(0,1.25,0); }
if(mode==='faces'){ const a=put(M,-0.42,0,0.15,{pose:'idle'}); P3.setExpr(a,'smile'); const b=put(F,0.42,0,-0.15,{pose:'idle'}); camera.position.set(0,1.62,1.35); camera.lookAt(0,1.6,0); }
if(mode==='npcs'){ const C=P3.CAST; put(C.an,-3,0,0.1,{pose:'idle'}); put(C.zhe,-1.5,0,-0.2,{pose:'idle',handsPockets:true}); put(C.sis,0,0,0.2,{pose:'idle'}); put(C.kai,1.5,0,0,{pose:'walk',speed:1.4}); put(C.yu,3,0,-0.3,{pose:'idle'}); camera.position.set(0,1.9,7.4); camera.lookAt(0,0.95,0); }
if(mode==='poses'){ put(M,-3,0,0,{pose:'run',speed:4}); const seat=(x)=>{ const s=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.45,0.5),new THREE.MeshStandardMaterial({color:0xa8744a})); s.position.set(x,0.225,0); s.castShadow=true; scene.add(s); }; seat(-1.5); seat(0); put(M,-1.5,0,0,{pose:'sit'}); put(F,0,0,0,{pose:'read'}); put(F,1.5,0,0.3,{pose:'talk'}); put(M,3,0,0,{pose:'idle',handsPockets:true}); camera.position.set(0,1.9,7.4); camera.lookAt(0,0.95,0); }
let t=0; function frame(){ t+=1/60; for(const o of chars) P3.animate(o.c,1/60,o.state); renderer.render(scene,camera); requestAnimationFrame(frame); } frame();
</script></body></html>
